# Retry failed outbound messages every ten minutes.
#
# Vercel's Hobby plan allows each cron at most one run per day, which is fine
# for the daily sweep but slow for retries. Sending an invoice already delivers
# inline, so this only picks up messages whose first attempt failed — but
# waiting until 01:30 to retry a bounced invoice is not a real delivery story.
#
# GitHub's scheduler is best-effort and often runs late, sometimes by 10–15
# minutes under load. That is acceptable for a retry sweep and would not be for
# first delivery, which does not depend on this.
#
# To turn it on, add two repository secrets under
# Settings → Secrets and variables → Actions:
#
#   APP_URL       https://your-domain.com   (no trailing slash)
#   CRON_SECRET   the same value as the CRON_SECRET in your Vercel project
#
# Until both exist the job exits quietly, so a fork or a fresh clone does not
# fail its Actions tab for no reason.

name: Dispatch outbound queue

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  # Never let a slow run overlap the next tick — two drains at once would
  # attempt the same messages twice.
  group: dispatch-queue
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drain the queue
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set — nothing to do."
            echo "See the comments at the top of this file to enable it."
            exit 0
          fi

          # --fail-with-body so a 401 or 500 fails the run loudly and still
          # shows what the endpoint said.
          curl --silent --show-error --fail-with-body --max-time 120 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/dispatch"
